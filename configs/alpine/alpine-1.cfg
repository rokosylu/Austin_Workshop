# this is a shell script which will be sourced at boot (CML node configuration)
# alpine-1: End host - port-based PW to alpine-4
hostname alpine-1

# management (eth0)
ip link set eth0 up
ip addr flush dev eth0
ip addr add 198.18.1.21/24 dev eth0
ip route replace default via 198.18.1.1 dev eth0

# data port (eth1) toward the PE router
ip link set eth1 up
ip addr flush dev eth1
ip addr add 172.16.1.1/24 dev eth1

# configurable user account
USERNAME=cisco
PASSWORD=cisco
