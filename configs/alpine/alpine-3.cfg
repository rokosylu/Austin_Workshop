# this is a shell script which will be sourced at boot (CML node configuration)
# alpine-3: ROUTER between VLAN 10 and VLAN 11
hostname alpine-3

# management (eth0)
ip link set eth0 up
ip addr flush dev eth0
ip addr add 198.18.1.23/24 dev eth0
ip route replace default via 198.18.1.1 dev eth0

# data port (eth1) toward the PE router
ip link set eth1 up
modprobe 8021q 2>/dev/null
ip link add link eth1 name eth1.10 type vlan id 10
ip link set eth1.10 up
ip addr add 192.168.10.3/24 dev eth1.10
ip link add link eth1 name eth1.11 type vlan id 11
ip link set eth1.11 up
ip addr add 192.168.11.3/24 dev eth1.11

# act as a router between the two VLANs
sysctl -w net.ipv4.ip_forward=1 >/dev/null

# static routes
ip route replace 192.168.12.0/24 via 192.168.11.5

# configurable user account
USERNAME=cisco
PASSWORD=cisco
