# this is a shell script which will be sourced at boot (CML node configuration)
# alpine-2: End host - VLAN 10 PW to alpine-3
hostname alpine-2

# management (eth0)
ip link set eth0 up
ip addr flush dev eth0
ip addr add 198.18.1.22/24 dev eth0
ip route replace default via 198.18.1.1 dev eth0

# data port (eth1) toward the PE router
ip link set eth1 up
modprobe 8021q 2>/dev/null
ip link add link eth1 name eth1.10 type vlan id 10
ip link set eth1.10 up
ip addr add 192.168.10.2/24 dev eth1.10

# static routes
ip route replace 192.168.11.0/24 via 192.168.10.3
ip route replace 192.168.12.0/24 via 192.168.10.3

# configurable user account
USERNAME=cisco
PASSWORD=cisco
