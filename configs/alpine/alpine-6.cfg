# this is a shell script which will be sourced at boot (CML node configuration)
# alpine-6: End host - VLAN 12 PW to alpine-5
hostname alpine-6

# management (eth0)
ip link set eth0 up
ip addr flush dev eth0
ip addr add 198.18.1.26/24 dev eth0
ip route replace default via 198.18.1.1 dev eth0

# data port (eth1) toward the PE router
ip link set eth1 up
modprobe 8021q 2>/dev/null
ip link add link eth1 name eth1.12 type vlan id 12
ip link set eth1.12 up
ip addr add 192.168.12.6/24 dev eth1.12

# static routes
ip route replace 192.168.10.0/24 via 192.168.12.5
ip route replace 192.168.11.0/24 via 192.168.12.5

# configurable user account
USERNAME=cisco
PASSWORD=cisco
