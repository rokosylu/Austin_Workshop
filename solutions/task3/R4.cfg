! Task 3 reference solution - R4 (instructor copy)
! Verified on IOS XR 25.1.1. Apply in configuration mode, then: commit
! R4 already has mpls ldp (router-id 4.4.4.4, targeted-hello accept) from the baseline.
interface GigabitEthernet0/0/0/5
 description to alpine-4 eth1
 no shutdown
 l2transport
 !
!
l2vpn
 xconnect group PORT_BASED
  p2p R4_to_R1
   interface GigabitEthernet0/0/0/5
   neighbor ipv4 1.1.1.1 pw-id 100
   !
  !
 !
!
