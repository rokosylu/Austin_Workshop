! Task 3 reference solution - R1 (instructor copy)
! Verified on IOS XR 25.1.1. Apply in configuration mode, then: commit
! Requires the Task 2 underlay (Loopback0 1.1.1.1, OSPF, SR-MPLS) to be in place.
mpls ldp
 router-id 1.1.1.1
 address-family ipv4
  discovery targeted-hello accept
 !
!
interface GigabitEthernet0/0/0/5
 description to alpine-1 eth1
 no shutdown
 l2transport
 !
!
l2vpn
 xconnect group PORT_BASED
  p2p R1_to_R4
   interface GigabitEthernet0/0/0/5
   neighbor ipv4 4.4.4.4 pw-id 100
   !
  !
 !
!
