! Task 4 reference solution - R2 (instructor copy)
! Verified on IOS XR 25.1.1. Apply in configuration mode, then: commit
! R2 already has mpls ldp (targeted LDP) from the baseline.
interface GigabitEthernet0/0/0/5
 description to alpine-2 eth1
 no shutdown
!
interface GigabitEthernet0/0/0/5.10 l2transport
 description VLAN 10
 encapsulation dot1q 10
!
l2vpn
 xconnect group VLAN_BASED
  p2p VLAN10
   interface GigabitEthernet0/0/0/5.10
   neighbor ipv4 3.3.3.3 pw-id 10
   !
  !
 !
!
