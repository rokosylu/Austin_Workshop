! Task 4 reference solution - R6 (instructor copy)
! Verified on IOS XR 25.1.1. Apply in configuration mode, then: commit
! R6 already has mpls ldp (targeted LDP) from the baseline.
interface GigabitEthernet0/0/0/5
 description to alpine-6 eth1
 no shutdown
!
interface GigabitEthernet0/0/0/5.12 l2transport
 description VLAN 12
 encapsulation dot1q 12
!
l2vpn
 xconnect group VLAN_BASED
  p2p VLAN12
   interface GigabitEthernet0/0/0/5.12
   neighbor ipv4 5.5.5.5 pw-id 12
   !
  !
 !
!
